<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：与 scripts/lib/security-headers.mjs 的 CSP 逐字符一致（pwa.test 比对）；本页无内联脚本 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; font-src 'self' data: file:; connect-src 'self' http: https: file:; worker-src 'self' file:; media-src 'self' blob: file:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>淬题 qforge</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0fae6a" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div class="top-shell">
      <header class="topbar">
        <div class="topbar-left">
          <span class="brand" id="brand">淬题</span>
          <select id="bank-switch" class="bank-switch" title="切换题库" aria-label="切换题库"></select>
        </div>
        <div class="topbar-right">
          <button id="btn-manage-banks" class="btn btn-ghost" type="button" title="题库管理">题库管理</button>
          <button id="btn-help" class="btn btn-ghost" type="button" title="快捷键帮助（按 ? 打开）" aria-label="快捷键帮助">?</button>
          <button id="btn-theme" class="btn btn-ghost" type="button" title="切换深浅色" aria-label="切换深浅色">🌙</button>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="功能导航"></nav>
    </div>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="statusbar">
      <span id="status-text">就绪</span>
      <span id="status-extra"></span>
    </footer>

    <button id="btn-top" class="btn-float btn-top" type="button" title="回到顶部" aria-label="回到顶部">↑</button>
    <button id="btn-bottom" class="btn-float btn-bottom" type="button" title="直达底部" aria-label="直达底部">↓</button>
  </div>

  <div id="toast-wrap" class="toast-wrap" aria-live="assertive"></div>
  <div id="modal-root" class="modal-root" hidden></div>

  <!-- 内置样例数据（window.SAMPLE_DATA），file:// 下无需 fetch -->
  <script src="js/data/sample-data.js"></script>

  <!-- 配置与工具 -->
  <script src="js/config.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/utils/rich-text.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/fnv.js"></script>
  <script src="js/utils/random.js"></script>
  <script src="js/utils/shuffle.js"></script>
  <script src="js/utils/answer-normalize.js"></script>
  <script src="js/utils/answer-text.js"></script>
  <script src="js/utils/judge-answer.js"></script>
  <script src="js/utils/question-id.js"></script>
  <script src="js/utils/zip-reader.js"></script>
  <script src="js/utils/zip-writer.js"></script>
  <script src="js/utils/xml-lite.js"></script>
  <script src="js/utils/assets.js"></script>
  <script src="js/utils/weights.js"></script>

  <!-- 数据访问层 -->
  <script src="js/data/contracts.js"></script>
  <script src="js/data/wire.js"></script>
  <script src="js/data/local-adapter.js"></script>
  <script src="js/data/api-adapter.js"></script>
  <script src="js/data/db.js"></script>
  <script src="js/modules/qbk.js"></script>

  <!-- 导入器 -->
  <script src="js/importers/adapters.js"></script>
  <script src="js/importers/json-importer.js"></script>
  <script src="js/importers/csv-importer.js"></script>
  <script src="js/importers/line-parser.js"></script>
  <script src="js/importers/xlsx-importer.js"></script>
  <script src="js/importers/docx-importer.js"></script>
  <script src="js/importers/qbk-importer.js"></script>
  <script src="js/importers/md-importer.js"></script>
  <script src="js/importers/registry.js"></script>

  <!-- 业务模块 -->
  <script src="js/modules/quiz-engine.js"></script>
  <script src="js/modules/wrong-book.js"></script>
  <script src="js/modules/favorites.js"></script>
  <script src="js/modules/history.js"></script>
  <script src="js/modules/statistics.js"></script>
  <script src="js/modules/search-filter.js"></script>
  <script src="js/modules/fsrs.js"></script>
  <script src="js/modules/fsrs-train-core.js"></script>
  <script src="js/modules/fsrs-opt.js"></script>
  <script src="js/modules/fsrs-train-client.js"></script>
  <script src="js/modules/srs.js"></script>
  <script src="js/modules/srs-store.js"></script>
  <script src="js/modules/sched-settings.js"></script>
  <script src="js/modules/start-prefs.js"></script>
  <script src="js/modules/review-queue.js"></script>
  <script src="js/modules/progress-saver.js"></script>
  <script src="js/modules/exam-timer.js"></script>
  <script src="js/modules/ui-renderer.js"></script>
  <script src="js/modules/dom-patch.js"></script>
  <script src="js/modules/bank-manager.js"></script>
  <script src="js/modules/question-editor.js"></script>
  <script src="js/modules/source.js"></script>
  <script src="js/modules/data-io.js"></script>
  <script src="js/modules/office-writer.js"></script>
  <script src="js/modules/share-page.js"></script>
  <script src="js/modules/exporter.js"></script>
  <script src="js/modules/backup.js"></script>
  <script src="js/modules/migrate.js"></script>
  <script src="js/modules/sync-dav.js"></script>
  <script src="js/modules/blueprint.js"></script>

  <!-- 主应用 -->
  <script src="js/app.js"></script>
</body>
</html>

# 淬题 qforge 逻辑层回归
# 纯 Node 内置 API 运行，零依赖、无需 npm install。
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-check:
    # 轻量独立 job：不 spawn 套件、不跑 bench（套件/断言/门禁用基线，运行项与首屏体积实时读取）
    # 数字有意变化时在本地运行 `node scripts/docs-check.mjs --write` 刷新基线并同 commit 提交。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 文档数字校验（静态基线；README / docs/DEVELOPMENT.md）
        run: node scripts/docs-check.mjs --static
      - name: 文档链接 / 锚点 / 版本读数
        run: node scripts/docs-links.mjs
      - name: 装配顺序（81 个 script 的顺序即依赖图）
        run: node scripts/check-modules.mjs
      - name: 结构性删除的账本
        run: node scripts/check-deletions.mjs

  logic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '24']
        tz: ['UTC', 'Asia/Shanghai']
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 时区确认（${{ matrix.tz }}）
        run: node -e "console.log('TZ=' + (process.env.TZ || 'system-default'))"
      - name: 冒烟测试（六题型/真实 541 题/三格式往返/CRUD/答题卡）
        run: node scripts/smoke-test.mjs
      - name: 导出单元测试
        run: node scripts/exporter.test.mjs
      - name: Office（xlsx/docx）导出往返测试
        run: node scripts/office-export.test.mjs
      - name: 极简 XML 解析器测试
        run: node scripts/xml-lite.test.mjs
      - name: 题目编辑器测试
        run: node scripts/editor.test.mjs
      - name: 富文本渲染器测试
        run: node scripts/rich-text.test.mjs
      - name: 图片资产/题库包测试
        run: node scripts/assets.test.mjs
      - name: 组卷蓝图测试
        run: node scripts/blueprint.test.mjs
      - name: 来源与网络导入测试
        run: node scripts/source.test.mjs
      - name: FSRS 调度器测试
        run: node scripts/fsrs.test.mjs
      - name: FSRS 参数优化器测试
        run: node scripts/fsrs-opt.test.mjs
      - name: SRS 到期/存储测试
        run: node scripts/srs.test.mjs
      - name: Storage 可靠性测试
        run: node scripts/storage.test.mjs
      - name: 备份恢复测试
        run: node scripts/backup.test.mjs
      - name: schema 迁移测试
        run: node scripts/migrate.test.mjs
      - name: 题目分片存储测试
        run: node scripts/shard.test.mjs
      - name: 数据契约层测试
        run: node scripts/contract.test.mjs
      - name: 参考后端 + api 适配器端到端测试
        run: node scripts/api-backend.test.mjs
      - name: 今日复习队列 / 复习设置测试
        run: node scripts/review-queue.test.mjs
      - name: 静态服务路径守卫测试
        run: node scripts/static-server.test.mjs
      - name: WebDAV 云备份测试
        run: node scripts/sync-dav.test.mjs
      - name: PWA 资源校验
        run: node scripts/pwa.test.mjs
      - name: UI 渲染器弹窗构建测试
        run: node scripts/ui-renderer.test.mjs
      - name: DOM 增量更新区域对账测试
        run: node scripts/dom-patch.test.mjs
      - name: 性能门禁（Node 24 / Asia-Shanghai）
        if: matrix.node-version == '24' && matrix.tz == 'Asia/Shanghai'
        run: node --expose-gc scripts/bench.mjs --assert

  vendor-check:
    name: vendor 接线自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: vendor 路径 ↔ ngm.json ↔ ngm.lock
        run: node scripts/check-ngm.mjs

  ngm-preflight:
    name: ngm binary configuration preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain optional ngm verify
        run: |
          if [ -z "${{ vars.NGM_BIN_URL }}" ] || [ -z "${{ vars.NGM_BIN_SHA256 }}" ]; then
            echo "::notice::ngm verify skipped: set repository variables NGM_BIN_URL and NGM_BIN_SHA256 to a reachable ngm release artifact. The vendor self-check still runs."
          else
            echo "ngm verify configured: ${{ vars.NGM_BIN_URL }}"
          fi

  ngm-verify:
    name: ngm verify --deep (optional binary)
    if: ${{ vars.NGM_BIN_URL != '' && vars.NGM_BIN_SHA256 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned ngm binary
        env:
          NGM_BIN_URL: ${{ vars.NGM_BIN_URL }}
          NGM_BIN_SHA256: ${{ vars.NGM_BIN_SHA256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ngm"
          if ! curl -fsSL --retry 3 --retry-delay 2 "$NGM_BIN_URL" -o "$bin"; then
            echo "::error::failed to download ngm from NGM_BIN_URL; the runner is network-restricted or the URL is stale"
            exit 1
          fi
          echo "$NGM_BIN_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          want="$(tr -d '\r\n' < .ngm-version)"
          got="$("$bin" --version | awk '{print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::ngm version mismatch: binary=$got expected=$want"
            exit 1
          fi
      - name: Verify vendor provenance
        run: |
          "$RUNNER_TEMP/ngm" verify --deep

  discipline:
    # 十问看板（方法论 §8）：只回答"这个仓库几档、缺哪一条"，不改任何东西。
    # --strict 在低于 L3 时退 1——防止新仓库悄悄从 L0 起步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 十问看板
        run: node scripts/check-discipline.mjs --strict

# 淬题 qforge 逻辑层回归
# 纯 Node 内置 API 运行，零依赖、无需 npm install。
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-check:
    # 轻量独立 job：不 spawn 套件、不跑 bench（套件/断言/门禁用基线，运行项与首屏体积实时读取）
    # 数字有意变化时在本地运行 `node scripts/docs-check.mjs --write` 刷新基线并同 commit 提交。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 文档数字校验（静态基线；README / docs/DEVELOPMENT.md）
        run: node scripts/docs-check.mjs --static
      - name: 异步卫生（空 catch / 未处理 Promise；历史存量走有到期日的基线）
        run: node scripts/check-async-hygiene.mjs
      - name: 按需包体积上限（防漂移线；超限指出包名与超出量）
        run: node scripts/check-bundle-size.mjs
      - name: CI 覆盖自检（logic-tests 单步 + ORDER 与磁盘双向一致）
        run: node scripts/check-ci-coverage.mjs
      - name: 文档链接 / 锚点 / 版本读数
        run: node scripts/docs-links.mjs
      - name: 装配顺序（88 个 script 的顺序即依赖图）
        run: node scripts/check-modules.mjs
      - name: 依赖方向（数据层不得反向点名领域模块）
        run: node scripts/check-layers.mjs
      - name: 真实引用 / 未登记越层 / 双向环（全局符号归属）
        run: node scripts/check-deps.mjs
      - name: CSP 三处同步（index.html / security-headers / 部署白名单）
        run: node scripts/check-csp.mjs
      - name: 结构性删除的账本
        run: node scripts/check-deletions.mjs
      - name: 变更档案分卷（索引 ↔ 卷 双向）
        run: node scripts/check-changelog.mjs

  a11y:
    # 静态无障碍门禁独立成 job：色对对比度 / ARIA / 焦点约定 / reduced-motion。
    # test-all 里也会跑同一条命令（本 job 提供独立的红绿信号，避免被其它套件噪声淹没）。
    # 真机行为（布局溢出、44px 热区、真实焦点循环）由 scripts/a11y-browser.mjs 人工执行，
    # 需要真实 Edge 窗口，不进入 CI；本 job 只做源码/快照静态断言。
    name: 无障碍静态门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 静态无障碍门禁（色对 / ARIA / 焦点约定 / 动效）
        run: node scripts/a11y.test.mjs

  e2e:
    # 浏览器端到端门禁：独立 job，不进六格矩阵（矩阵口径与耗时都不受影响）。
    # 真实 Chromium（ubuntu runner 预装 Google Chrome）+ 本地静态服务；
    # 六场景见 scripts/e2e-ci.mjs 与 docs/TESTING.md，目标 3 分钟、8 分钟硬上限。
    name: 浏览器端到端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 六场景端到端（headless chromium）
        run: node scripts/e2e-ci.mjs
      # 红绿都上传：result.json / run.log / trace.json / screenshots / downloads。
      - name: 上传取证（截图 / trace / result）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .analysis/e2e-ci/
          if-no-files-found: ignore
          retention-days: 7

  logic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '24', '26']
        tz: ['UTC', 'Asia/Shanghai']
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 时区确认（${{ matrix.tz }}）
        run: node -e "console.log('TZ=' + (process.env.TZ || 'system-default'))"
      # 单步跑全量：与本地 `npm test` 同一条命令、同一套件集合。
      # 逐套件步骤曾长期停留在 24/30——新增套件忘了加步骤时，缺的那些在 CI 里根本不跑，
      # 而 job 仍是绿的。test-all 自带逐套件断言数比对（见 scripts/test-all.mjs），
      # 覆盖率由 scripts/check-ci-coverage.mjs 静态断言。
      - name: 全量逻辑层测试（${{ matrix.node-version }} / ${{ matrix.tz }}）
        run: node scripts/test-all.mjs
      - name: 性能门禁（Node 24/26 · Asia-Shanghai）
        if: (matrix.node-version == '24' || matrix.node-version == '26') && matrix.tz == 'Asia/Shanghai'
        run: node --expose-gc scripts/bench.mjs --assert
      # 失败留证：test-all 把逐套件进度与失败摘要写到 .analysis/test-failures/，
      # bench 把红灯快照写到 .analysis/bench-failures/；job 日志匿名取不到（403），
      # 这里用 if: always() 保证红绿都走一遍，红了就能直接下载 artifact 看套件名与断言原文。
      - name: 上传失败取证（${{ matrix.node-version }} / ${{ matrix.tz }}）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-node${{ matrix.node-version }}-${{ matrix.tz == 'UTC' && 'utc' || 'asia-shanghai' }}
          path: |
            .analysis/test-failures/
            .analysis/bench-failures/
          if-no-files-found: ignore
          retention-days: 7

  vendor-check:
    name: vendor 接线自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: vendor 路径 ↔ ngm.json ↔ ngm.lock
        run: node scripts/check-ngm.mjs
      - name: vendor 门禁自检（缺清单文件必须失败）
        run: node scripts/check-ngm.mjs --selftest

  ngm-preflight:
    name: ngm binary configuration preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain optional ngm verify
        run: |
          if [ -z "${{ vars.NGM_BIN_URL }}" ] || [ -z "${{ vars.NGM_BIN_SHA256 }}" ]; then
            echo "::notice::ngm verify skipped: set repository variables NGM_BIN_URL and NGM_BIN_SHA256 to a reachable ngm release artifact. The vendor self-check still runs."
          else
            echo "ngm verify configured: ${{ vars.NGM_BIN_URL }}"
          fi

  ngm-verify:
    name: ngm verify --deep (optional binary)
    if: ${{ vars.NGM_BIN_URL != '' && vars.NGM_BIN_SHA256 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned ngm binary
        env:
          NGM_BIN_URL: ${{ vars.NGM_BIN_URL }}
          NGM_BIN_SHA256: ${{ vars.NGM_BIN_SHA256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ngm"
          if ! curl -fsSL --retry 3 --retry-delay 2 "$NGM_BIN_URL" -o "$bin"; then
            echo "::error::failed to download ngm from NGM_BIN_URL; the runner is network-restricted or the URL is stale"
            exit 1
          fi
          echo "$NGM_BIN_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          want="$(tr -d '\r\n' < .ngm-version)"
          got="$("$bin" --version | awk '{print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::ngm version mismatch: binary=$got expected=$want"
            exit 1
          fi
      - name: Verify vendor provenance
        run: |
          "$RUNNER_TEMP/ngm" verify --deep

  discipline:
    # 十问看板（方法论 §8）：只回答"这个仓库几档、缺哪一条"，不改任何东西。
    # --strict 在存在任何缺口时退 1——不允许「有一条是红的但整体还是绿的」。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 十问看板
        run: node scripts/check-discipline.mjs --strict

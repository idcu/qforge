# 淬题 qforge 发布校验（只校验，不部署）
#
# 发布方式（唯一）：
#   - **推 main → GitHub Pages 自动从 main 分支根目录发布**（仓库根即静态站点，`.nojekyll` 已就位）。
#   - 打 `v*` tag 只是留痕 + 触发本工作流做发布前校验，**不会**部署任何东西。
#
# 本工作流职责（只读，产物只写 $RUNNER_TEMP，永不改写工作区）：
#   - push tag v*        → 证明「这个 tag 的内容可发布」：门禁 + 产物自检
#   - pull_request(main) → 同样的校验（dry-run 版本号 v0.0.0-dryrun）
#   - workflow_dispatch  → 对指定 tag 复跑校验（发版前预演 / 回滚前核对旧版）
#
# 历史说明：旧版在这里用 actions/deploy-pages 部署 Pages，但仓库的 Pages 发布源是
# 「main 分支」，两者互斥，tag 上必然失败。现已移除全部部署步骤与 pages/id-token 权限。
name: release-check

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '要校验的 tag（必填，例如 v1.0.1）'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 快速门禁（装配 / 依赖 / 文档 / 测试）
        run: npm run verify:fast

      - name: 发布一致性（版本 / CACHE / 脚本数）
        run: node scripts/check-release.mjs

      - name: 产物版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.ref }}"
          else
            v="v0.0.0-dryrun"
          fi
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::版本号必须形如 v1.2.3（收到 $v）"; exit 1 ;;
          esac
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: 生成产物（只写 $RUNNER_TEMP）
        run: node scripts/build-staging.mjs --out "$RUNNER_TEMP/staging" --version "${{ steps.version.outputs.value }}" --assert

      - name: 产物自检（脚本必须与实现同步）
        run: node scripts/build-staging.mjs --selftest

      - name: 工作区必须未被改写
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::校验流程改写了仓库文件："
            echo "$dirty"
            exit 1
          fi
